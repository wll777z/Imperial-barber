name: Validate Imperial Barber
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Offline browser checks
        run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())") npm run test:e2e
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: imperial_test
        ports: ['54328:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:integration
# Full local Auth/Storage browser suite: npm run test:e2e:live after the documented local fixture.
# It is not reported as passing in CI unless explicitly run with that local stack.
